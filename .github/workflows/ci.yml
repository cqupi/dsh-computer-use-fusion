name: Validate plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dsh: [0.2.0-rc.2, 0.2.1-alpha.2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm install --prefix .compat/host --ignore-scripts @deepseek-ai/dsh-tools@${{ matrix.dsh }} @deepseek-ai/dsh-skill@${{ matrix.dsh }}
      - run: node scripts/host-smoke.mjs .compat/host
      - if: runner.os == 'Windows' && matrix.dsh == '0.2.0-rc.2'
        run: npm run test:windows
      - if: runner.os == 'Linux' && matrix.dsh == '0.2.0-rc.2'
        run: |
          npm run package
          npm install --prefix .compat/packed --ignore-scripts --legacy-peer-deps ./dist/*.tgz
          node scripts/host-smoke.mjs . .compat/packed/node_modules/@cqupi/dsh-computer-use-fusion
      - if: runner.os == 'Linux' && matrix.dsh == '0.2.0-rc.2'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-installable-plugin
          path: |
            dist/*.tgz
            dist/SHA256SUMS
            dist/INSTALL.zh-CN.md
          if-no-files-found: error
  macos-source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-macos.mjs
      - run: node scripts/macos-helper-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-macos-helper
          path: |
            native/macos/bin/dsh-computer-use-helper
            native/macos/manifest.json
